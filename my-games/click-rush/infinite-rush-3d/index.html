<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>INFINITE RUSH 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,15,40,.72);text-align:center;padding:16px;overflow:auto}
.hide{display:none!important}
h1{margin:0;font-size:clamp(30px,8vw,56px);letter-spacing:2px;background:linear-gradient(#fff176,#ff7043);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.b{background:linear-gradient(#ffca28,#ff8f00);color:#2a1800;border:0;border-radius:14px;padding:12px 24px;font:800 18px system-ui;cursor:pointer;box-shadow:0 4px 0 #a85d00}
.b.s{background:linear-gradient(#80d8ff,#0288d1);color:#00263a;box-shadow:0 4px 0 #01579b}
.b:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ch{border:3px solid transparent;border-radius:14px;background:#ffffff18;padding:8px 14px;cursor:pointer;font-weight:700}
.ch.on{border-color:#ffca28;background:#ffffff30}
.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 4px}
.card{background:#ffffff14;border-radius:12px;padding:8px 14px;font-size:14px;text-align:left;min-width:min(320px,86vw)}
#hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;pointer-events:none}
#hud button{pointer-events:auto;background:#0008;color:#fff;border:2px solid #fff6;border-radius:10px;width:42px;height:42px;font-size:18px;margin-left:6px}
#sc{font-size:34px;font-weight:900;text-shadow:0 2px 6px #000a}
#pwr{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{background:#000a;border-radius:10px;padding:3px 8px;font-weight:700;font-size:14px}
small{opacity:.85;display:block}
</style></head><body>
<div id="hud" class="hide"><div><div id="sc">0</div><small id="bs"></small><div id="pwr"></div></div>
<div style="text-align:right"><div style="display:flex;justify-content:flex-end"><div id="cn" class="chip" style="font-size:20px;align-self:center">🪙 0</div><button id="pb">❚❚</button><button id="rb">⟲</button></div></div></div>

<div id="menu" class="ov">
<h1>INFINITE RUSH 3D</h1><div>Best <b id="mb">0</b> · Bank 🪙 <b id="mc">0</b></div>
<div class="row" id="chars"></div>
<button class="b" id="play">▶ PLAY</button>
<div class="row"><button class="b s" id="daily">🎁 Daily Reward</button><button class="b s" id="mute">🔊 Sound</button></div>
<div class="card"><b>Missions (single run)</b><div id="ms"></div></div>
<small>Swipe ← → change lane · ↑ jump · ↓ slide (or use arrow keys / WASD)</small></div>

<div id="pause" class="ov hide"><h1>PAUSED</h1><button class="b" id="resume">Resume</button><button class="b s" id="pmenu">Main Menu</button></div>

<div id="over" class="ov hide"><h1>GAME OVER</h1>
<div style="font-size:22px">Score <b id="os">0</b> · Best <b id="ob">0</b></div><div style="font-size:20px">Coins this run 🪙 <b id="oc">0</b></div>
<div id="om" style="color:#ffe082"></div>
<button class="b" id="again">⟲ Restart</button><button class="b s" id="revive">📺 Watch Ad to Revive</button><button class="b s" id="omenu">Main Menu</button></div>

<div id="ad" class="ov hide"><h1 style="font-size:28px">Ad playing…</h1><div>Demo placeholder — plug your ad SDK in here.<br>Reviving in <b id="adt">3</b>s</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem('ir_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ir_'+k,JSON.stringify(v))}catch(e){}}};
let best=S.get('best',0),bank=S.get('coins',0),charI=S.get('char',0);
const CH=[{n:'Rex',c:0xff5252,h:0xffcc99,a:0x263238},{n:'Nova',c:0x40c4ff,h:0xf1c27d,a:0xffeb3b},{n:'Zed',c:0x69f0ae,h:0x8d5524,a:0x6a1b9a}];
const M=[{t:'Collect 60 coins in one run',k:'coins',g:60,r:100},{t:'Run 800 m in one run',k:'dist',g:800,r:150},{t:'Grab 3 power-ups in one run',k:'pu',g:3,r:120}];
const today=()=>new Date().toISOString().slice(0,10);
// ---------- audio (synthesized) ----------
let AC,mute=S.get('mute',false);
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,sl){if(!AC||mute)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
const sfx={coin(){tone(880,.07,'square',.04);setTimeout(()=>tone(1320,.1,'square',.04),55)},jump(){tone(300,.22,'sine',.1,720)},slide(){tone(420,.2,'sawtooth',.04,120)},lane(){tone(520,.05,'triangle',.05)},pu(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.07),i*70))},brk(){tone(700,.25,'sawtooth',.08,150)},hit(){tone(160,.6,'sawtooth',.16,35)}};
const NT=[261,329,392,523,392,329,293,349,440,587,440,349],BS=[65,65,87,98];let ms=0;
setInterval(()=>{if(!AC||mute||st==='over'||st==='pause')return;const i=ms++;tone(NT[i%12],.16,'triangle',.035);if(i%4===0)tone(BS[(i>>2)%4]*2,.4,'sine',.07)},170);
// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.insertBefore(R.domElement,document.body.firstChild);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd0ff);scene.fog=new THREE.Fog(0x8fd0ff,35,140);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a8f,.75));
const dl=new THREE.DirectionalLight(0xfff2d0,.9);dl.position.set(9,20,8);dl.target.position.set(0,0,-8);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-16,right:16,top:30,bottom:-20,near:1,far:60});scene.add(dl,dl.target);
const gc={},mc={};
function bx(w,h,d,c,y,cast){const k=w+'_'+h+'_'+d,g=gc[k]||(gc[k]=new THREE.BoxGeometry(w,h,d)),m=mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c})),o=new THREE.Mesh(g,m);o.position.y=y||0;o.castShadow=cast!==false;o.receiveShadow=true;return o}
const LW=3.2,W=new THREE.Group();scene.add(W);
// ground, rails, sleepers
const gr=bx(200,.2,400,0x5d7a63,-.2,false);gr.position.z=-100;scene.add(gr);
const bed=bx(10.4,.2,400,0x3e3e48,-.05,false);bed.position.z=-100;scene.add(bed);
for(let l=0;l<3;l++)for(const s of[-.7,.7]){const r=bx(.12,.12,300,0xcfd8dc,.08,false);r.position.set((l-1)*LW+s,0,-100);scene.add(r)}
const sl=[];for(let i=0;i<40;i++){const m=bx(10,.08,.35,0x6d4c41,.03,false);m.position.z=-i*3.5+10;scene.add(m);sl.push(m)}
const bl=[],PAL=[0xef5350,0xffa726,0xffee58,0x66bb6a,0x29b6f6,0xab47bc,0xec407a,0xf5f5f5],UB=new THREE.BoxGeometry(1,1,1);
for(let s=-1;s<=1;s+=2)for(let i=0;i<14;i++){const c=PAL[Math.random()*8|0],m=new THREE.Mesh(UB,mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c})));bl.push({m,s});place(m,s,12-i*12)}
function place(m,s,z){const w=5+Math.random()*4,h=8+Math.random()*24,d=8+Math.random()*3;m.scale.set(w,h,d);m.position.set(s*(10+w/2+Math.random()*3),h/2,z)}
// player
const P=new THREE.Group();scene.add(P);let limbs=[];
const shM=new THREE.Mesh(new THREE.SphereGeometry(1.25,16,12),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.3}));shM.position.y=1;
const hvM=bx(.9,.1,1.8,0xff4081,.1),jtM=bx(.4,.6,.25,0x9e9e9e,1.1);jtM.position.z=-.3;
function buildChar(i){while(P.children.length)P.remove(P.children[0]);const C=CH[i];
const mk=(x,y,c)=>{const g=new THREE.Group();g.position.set(x,y,0);g.add(bx(.2,.7,.2,c,-.35));return g};
const l=mk(-.18,.7,C.a),r=mk(.18,.7,C.a),al=mk(-.47,1.35,C.c),ar=mk(.47,1.35,C.c);
P.add(bx(.7,.8,.4,C.c,1.05),bx(.45,.45,.45,C.h,1.65),bx(.5,.14,.5,C.a,1.96),l,r,al,ar,shM,hvM,jtM);limbs=[l,r,al,ar]}
buildChar(charI);
// ---------- game state ----------
let st='menu',speed=14,dist=0,coins=0,score=0,lane=1,px=0,py=0,vy=0,sT=0,pw={},inv=0,runPU=0,revived=false,obs=[],cns=[],pus=[],nextRow=20,t=0,ph=0,pcount=0,mdone=[];
const PU={jet:{c:0xff9100,d:6,i:'🚀'},mag:{c:0xe53935,d:10,i:'🧲'},sneak:{c:0x76ff03,d:10,i:'👟'},x2:{c:0xffd600,d:12,i:'2×'},shield:{c:0x00e5ff,d:15,i:'🛡️'},hover:{c:0xff4081,d:12,i:'🛹'}};
const PK=Object.keys(PU);
const coinG=new THREE.CylinderGeometry(.36,.36,.1,14),coinM=new THREE.MeshLambertMaterial({color:0xffc107,emissive:0x6b4a00}),puG=new THREE.IcosahedronGeometry(.55,0);
const OD={
box:{ow:1.8,oh:1.8,oy:0,od:1.8,v(g){g.add(bx(1.8,1.8,1.8,0xb5793a,.9),bx(1.84,.12,1.84,0x8d5a2b,.9))}},
barrier:{ow:2.2,oh:1,oy:0,od:.5,v(g){g.add(bx(2.2,.4,.3,0xff1744,.8),bx(.2,.8,.2,0x555555,.4).translateX(-.9),bx(.2,.8,.2,0x555555,.4).translateX(.9),bx(.5,.4,.32,0xffffff,.8))}},
block:{ow:2.2,oh:1.2,oy:0,od:.9,v(g){g.add(bx(2.2,1.1,.8,0xff6d00,.55),bx(2.22,.2,.82,0xffffff,.65))}},
train:{ow:2.3,oh:3.2,oy:0,od:12,vz:8,v(g){g.add(bx(2.3,2.8,12,0x3949ab,1.8),bx(2.32,.7,10.5,0xb3e5fc,2.4),bx(2,.4,11,0x222222,.2),bx(2.3,.3,12,0xffc107,1.1))}},
car:{ow:1.7,oh:1.4,oy:0,od:3.6,vz:16,v(g){g.add(bx(1.7,.7,3.6,0xffd600,.55),bx(1.4,.5,1.8,0x90caf9,1.15),bx(1.72,.2,3.2,0x212121,.2))}},
signal:{ow:2.4,oh:3,oy:1.1,od:.5,v(g){g.add(bx(2.4,.35,.3,0x37474f,1.4),bx(.2,4,.2,0x37474f,2).translateX(1.3),bx(.3,.8,.3,0x212121,1.95),bx(.2,.2,.34,0xff1744,2.2))}},
tunnel:{ow:2.4,oh:3,oy:1.1,od:14,v(g){g.add(bx(2.6,.6,14,0x6d4c41,1.4),bx(.3,1.7,14,0x4e342e,.85).translateX(-1.15),bx(.3,1.7,14,0x4e342e,.85).translateX(1.15))}}};
function addObs(l,z,ty){const D=OD[ty],g=new THREE.Group();D.v(g);g.position.set((l-1)*LW,0,z-(D.od>6?D.od/2:0));W.add(g);obs.push({g,ow:D.ow,oh:D.oh,oy:D.oy,od:D.od,vz:D.vz||0})}
function addCoin(l,z,y){const m=new THREE.Mesh(coinG,coinM);m.rotation.x=Math.PI/2;m.position.set((l-1)*LW,y,z);m.castShadow=true;W.add(m);cns.push(m)}
function addPU(l,z){const k=PK[Math.random()*6|0],m=new THREE.Mesh(puG,new THREE.MeshLambertMaterial({color:PU[k].c,emissive:PU[k].c,emissiveIntensity:.5}));m.position.set((l-1)*LW,1.3,z);m.userData.k=k;W.add(m);pus.push(m)}
function spawnRow(z){const d=Math.min(dist/1500,1),free=Math.random()*3|0,ty=['barrier','box','block','signal'];if(d>.04)ty.push('train');if(d>.1)ty.push('tunnel','car');
[0,1,2].forEach(l=>{if(l!==free&&Math.random()<.4+d*.45)addObs(l,z,ty[Math.random()*ty.length|0])});
if(Math.random()<.8){const n=5+(Math.random()*5|0),arc=Math.random()<.3,cl=Math.random()<.3?(free+1+(Math.random()*2|0))%3:free;for(let i=0;i<n;i++)addCoin(cl===free||!obs.some(o=>0)?free:free,z-i*2,arc?1.2+Math.sin(i/(n-1)*Math.PI)*2:1.2)}
if(Math.random()<.07)addPU(free,z-12)}
function clearAll(){[...obs.map(o=>o.g),...cns,...pus].forEach(o=>W.remove(o));obs=[];cns=[];pus=[]}
function reset(){clearAll();speed=14;dist=0;coins=0;score=0;lane=1;px=0;py=0;vy=0;sT=0;pw={};inv=0;runPU=0;revived=false;nextRow=20;P.rotation.x=0;P.visible=true;for(let z=-40;z>-110;z-=24)spawnRow(z)}
// ---------- input ----------
function act(a){if(st!=='play')return;ac();
if(a==='l'&&lane>0){lane--;sfx.lane()}else if(a==='r'&&lane<2){lane++;sfx.lane()}
else if(a==='u'&&py<.05&&!pw.jet){vy=pw.sneak?16:11.5;sT=0;sfx.jump()}
else if(a==='d'){if(py>.1)vy=-24;sT=.7;sfx.slide()}}
let tx0=null,ty0=0;
function sw(x,y){if(Math.abs(x)<28&&Math.abs(y)<28)return false;act(Math.abs(x)>Math.abs(y)?(x<0?'l':'r'):(y<0?'u':'d'));return true}
addEventListener('touchstart',e=>{if(e.target.closest('button,.ov'))return;const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;ac()},{passive:true});
addEventListener('touchmove',e=>{if(tx0===null)return;const t=e.touches[0];if(sw(t.clientX-tx0,t.clientY-ty0))tx0=null},{passive:true});
addEventListener('touchend',()=>{tx0=null});
addEventListener('mousedown',e=>{if(e.target.closest('button,.ov'))return;tx0=e.clientX;ty0=e.clientY});
addEventListener('mouseup',e=>{if(tx0!==null){sw(e.clientX-tx0,e.clientY-ty0);tx0=null}});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();({arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'})[k]&&(e.preventDefault(),act(({arrowleft:'l',a:'l',arrowright:'r',d:'r',arrowup:'u',w:'u',' ':'u',arrowdown:'d',s:'d'})[k]));if(k==='p'||k==='escape')togglePause()});
// ---------- loop ----------
function scroll(dt,sp){sl.forEach(m=>{m.position.z+=sp*dt;if(m.position.z>12)m.position.z-=140});bl.forEach(b=>{b.m.position.z+=sp*dt;if(b.m.position.z>25){place(b.m,b.s,b.m.position.z-168)}})}
function crash(){st='over';sfx.hit();P.rotation.x=-.7;mdone=mdone;setTimeout(showOver,450)}
function hit(){if(pw.jet||inv>0)return;if(pw.shield||pw.hover){delete pw.shield;delete pw.hover;inv=1.3;sfx.brk();return}crash()}
function play(dt){
speed=Math.min(40,14+dist*.012);const sp=speed*dt;dist+=sp;score+=sp*(pw.x2?2:1);
if(dist>=nextRow){spawnRow(-110);nextRow+=13+speed*.6+Math.random()*8}
for(const k in pw){pw[k]-=dt;if(pw[k]<=0)delete pw[k]}
if(inv>0)inv-=dt;if(sT>0)sT-=dt;
px+=((lane-1)*LW-px)*Math.min(1,dt*14);
if(pw.jet){py+=(5-py)*Math.min(1,dt*5);vy=0}else{vy-=36*dt;py+=vy*dt;if(py<0){py=0;vy=0}}
const ph_=sT>0?.8:1.7;
for(let i=obs.length-1;i>=0;i--){const o=obs[i],g=o.g;g.position.z+=(speed+o.vz)*dt;const z=g.position.z;
if(Math.abs(z)<o.od/2+.3&&Math.abs(px-g.position.x)<o.ow/2+.25&&py<o.oy+o.oh&&py+ph_>o.oy)hit();
if(z-o.od/2>12){W.remove(g);obs.splice(i,1)}}
const my=pw.jet?6:1.4;
for(let i=cns.length-1;i>=0;i--){const c=cns[i];c.position.z+=sp;c.rotation.z+=dt*4;
if(pw.mag){const dx=px-c.position.x,dy=py+1-c.position.y,dz=-c.position.z,d=Math.hypot(dx,dy,dz);if(d<12){const k=Math.min(1,dt*14);c.position.x+=dx*k;c.position.y+=dy*k;c.position.z+=-dz*k*-1*-1*0+(0-c.position.z)*k}}
if(Math.abs(c.position.z)<1.1&&Math.abs(c.position.x-px)<1.3&&Math.abs(c.position.y-py-1)<my){coins++;score+=10;sfx.coin();W.remove(c);cns.splice(i,1)}else if(c.position.z>10){W.remove(c);cns.splice(i,1)}}
for(let i=pus.length-1;i>=0;i--){const p=pus[i];p.position.z+=sp;p.rotation.y+=dt*3;p.position.y=1.3+Math.sin(t*4)*.2;
if(Math.abs(p.position.z)<1.2&&Math.abs(p.position.x-px)<1.4&&Math.abs(p.position.y-py-1)<my+.5){const k=p.userData.k;pw[k]=PU[k].d;runPU++;sfx.pu();W.remove(p);pus.splice(i,1)}else if(p.position.z>10){W.remove(p);pus.splice(i,1)}}
scroll(dt,speed);anim(dt,ph_);hud(dt)}
function anim(dt,h){ph+=dt*speed*.55;const run=py<.05;limbs[0].rotation.x=run?Math.sin(ph)*.9:.6;limbs[1].rotation.x=run?-Math.sin(ph)*.9:-.6;limbs[2].rotation.x=run?-Math.sin(ph)*.8:-1.5;limbs[3].rotation.x=run?Math.sin(ph)*.8:-1.5;
P.position.set(px,py+(run&&!pw.hover?Math.abs(Math.sin(ph))*.08:0)+(pw.hover?.12:0),0);P.scale.y=sT>0?.55:1;P.rotation.z=(lane-1)*LW-px>.3?-.2:(lane-1)*LW-px<-.3?.2:0;
shM.visible=!!pw.shield;hvM.visible=!!pw.hover;jtM.visible=!!pw.jet;P.visible=inv>0?Math.floor(t*20)%2===0:true}
let hc=0;
function hud(dt){$('sc').textContent=Math.floor(score);$('cn').textContent='🪙 '+(bank+coins);$('bs').textContent='Best '+Math.max(best,Math.floor(score));
if((hc-=dt)<=0){hc=.1;$('pwr').innerHTML=Object.keys(pw).map(k=>'<span class="chip">'+PU[k].i+' '+Math.ceil(pw[k])+'s</span>').join('')}}
function showOver(){const sc=Math.floor(score);let msg='';if(sc>best){best=sc;S.set('best',best)}
const d=S.get('ms',{d:today(),done:[]}),ms_=d.d===today()?d:{d:today(),done:[]},v={coins,dist:Math.floor(dist),pu:runPU};let bonus=0;
M.forEach((m,i)=>{if(v[m.k]>=m.g&&!ms_.done.includes(i)){ms_.done.push(i);bonus+=m.r;msg+='✔ '+m.t+' +'+m.r+'🪙<br>'}});
S.set('ms',ms_);bank+=coins+bonus;S.set('coins',bank);
$('os').textContent=sc;$('ob').textContent=best;$('oc').textContent=coins;$('om').innerHTML=msg;$('revive').classList.toggle('hide',revived);$('over').classList.remove('hide');$('hud').classList.add('hide')}
function refresh(){$('mb').textContent=best;$('mc').textContent=bank;const d=S.get('ms',{d:'',done:[]}),dn=d.d===today()?d.done:[];
$('ms').innerHTML=M.map((m,i)=>(dn.includes(i)?'✅ ':'⬜ ')+m.t+' (+'+m.r+'🪙)').join('<br>');
const dr=S.get('daily',{d:'',s:0});$('daily').disabled=dr.d===today();$('daily').textContent=dr.d===today()?'🎁 Claimed today':'🎁 Daily Reward';$('mute').textContent=mute?'🔇 Sound off':'🔊 Sound on'}
function menu(){st='menu';clearAll();P.rotation.x=0;P.visible=true;pw={};inv=0;sT=0;py=0;px=0;lane=1;['over','pause'].forEach(i=>$(i).classList.add('hide'));$('hud').classList.add('hide');$('menu').classList.remove('hide');refresh()}
function start(){ac();reset();['menu','over','pause'].forEach(i=>$(i).classList.add('hide'));$('hud').classList.remove('hide');st='play'}
function togglePause(){if(st==='play'){st='pause';$('pause').classList.remove('hide')}else if(st==='pause'){st='play';$('pause').classList.add('hide')}}
$('chars').innerHTML=CH.map((c,i)=>'<div class="ch" data-i="'+i+'"><div class="dot" style="background:#'+c.c.toString(16).padStart(6,'0')+'"></div>'+c.n+'</div>').join('');
function selChar(){document.querySelectorAll('.ch').forEach(e=>e.classList.toggle('on',+e.dataset.i===charI))}selChar();
$('chars').onclick=e=>{const c=e.target.closest('.ch');if(c){charI=+c.dataset.i;S.set('char',charI);buildChar(charI);selChar();ac();sfx.lane()}};
$('play').onclick=start;$('again').onclick=start;$('rb').onclick=start;$('pb').onclick=togglePause;$('resume').onclick=togglePause;$('pmenu').onclick=menu;$('omenu').onclick=menu;
$('mute').onclick=()=>{mute=!mute;S.set('mute',mute);ac();refresh()};
$('daily').onclick=()=>{const dr=S.get('daily',{d:'',s:0}),y=new Date(Date.now()-864e5).toISOString().slice(0,10),s=dr.d===y?dr.s+1:1;bank+=50+25*Math.min(s-1,6);S.set('coins',bank);S.set('daily',{d:today(),s});ac();sfx.pu();refresh()};
$('revive').onclick=()=>{$('over').classList.add('hide');$('ad').classList.remove('hide');let n=3;$('adt').textContent=n;const iv=setInterval(()=>{n--;$('adt').textContent=n;if(n<=0){clearInterval(iv);$('ad').classList.add('hide');revived=true;bank-=coins;S.set('coins',bank);obs.filter(o=>o.g.position.z>-30).forEach(o=>{W.remove(o.g)});obs=obs.filter(o=>o.g.position.z<=-30);P.rotation.x=0;inv=2.5;$('hud').classList.remove('hide');st='play'}},1000)};
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?78:60;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
if(st==='play')play(dt);else if(st==='menu'){scroll(dt,9);speed=9;anim(dt,1.7)}
cam.position.x+=(px*.55-cam.position.x)*Math.min(1,dt*6);cam.position.y+=((pw.jet?7:5)-cam.position.y)*Math.min(1,dt*3);cam.position.z=8.5;cam.lookAt(px*.4,1.6,-12);R.render(scene,cam)}
refresh();requestAnimationFrame(loop);
</script></body></html>

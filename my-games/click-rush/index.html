<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Rush</title>
<style>
  html,body{margin:0;height:100%;background:#0b0720;color:#f3edff;font-family:system-ui,sans-serif;text-align:center;user-select:none}
  #hud{padding:12px;font-size:1.1rem}#area{position:relative;height:calc(100% - 100px);margin:0 12px;border:1px solid #2b1b52;border-radius:12px;overflow:hidden;touch-action:manipulation}
  #t{position:absolute;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle,#fff,#f59e0b 40%,#ec4899);box-shadow:0 0 24px #ec4899}
  #msg{position:absolute;inset:0;display:grid;place-content:center;background:rgba(11,7,32,.9);gap:10px}
  button.go{padding:12px 26px;border:0;border-radius:10px;font:700 1rem system-ui;background:linear-gradient(135deg,#b44dff,#22e5ff);cursor:pointer}
</style></head><body>
<div id="hud">Time: <b id="time">15</b> &nbsp; Score: <b id="s">0</b></div>
<div id="area"><button id="t" aria-label="Target" hidden></button>
  <div id="msg"><div><h2>Click Rush</h2><p>Tap the target as many times as you can in 15 seconds.</p><button class="go" id="go">Start</button></div></div></div>
<script>
  // Template for your own games: report scores to the STRAPPED page like this.
  const $=id=>document.getElementById(id),t=$("t"),area=$("area");let s=0,left=15,iv;
  function report(over){try{parent.postMessage({sg:"score",score:s,over:!!over},"*")}catch(e){}}
  function move(){t.style.left=Math.random()*(area.clientWidth-64)+"px";t.style.top=Math.random()*(area.clientHeight-64)+"px"}
  function start(){s=0;left=15;$("s").textContent=0;$("time").textContent=left;$("msg").hidden=true;t.hidden=false;move();report(false);
    iv=setInterval(()=>{$("time").textContent=--left;if(left<=0){clearInterval(iv);t.hidden=true;$("msg").hidden=false;$("msg").querySelector("h2").textContent="Time's up! Score: "+s;$("go").textContent="Play again";report(true)}},1000)}
  t.onclick=()=>{s++;$("s").textContent=s;move();report(false)};$("go").onclick=start;
</script></body></html>

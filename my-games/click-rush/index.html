
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Click Rush - STRAPPED GAMING</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#0b0720;color:white;
font-family:Arial,sans-serif;text-align:center;
}
#hud{padding:18px;font-size:25px}
#area{
position:relative;height:75vh;margin:10px;
border:2px solid #30205a;border-radius:20px;
overflow:hidden;background:#100a29;
}
#target{
position:absolute;width:65px;height:65px;
border:0;border-radius:50%;
background:linear-gradient(135deg,#bd42ff,#16d9ff);
box-shadow:0 0 25px #a34cff;
display:none;touch-action:manipulation;
}
#msg{
position:absolute;inset:0;display:flex;
flex-direction:column;justify-content:center;
align-items:center;padding:20px;
background:#100a29;
}
button{cursor:pointer}
.go{
padding:17px 35px;border:0;border-radius:15px;
font-size:21px;font-weight:bold;
background:linear-gradient(90deg,#ad48ff,#19d9ff);
color:#09051b;
}
#msg h2{font-size:30px}
</style>
</head>
<body>
<div id="hud">
Time: <span id="time">15</span>
&nbsp; Score: <span id="score">0</span>
</div>
<div id="area">
<button id="target" aria-label="Target"></button>
<div id="msg">
<h2>STRAPPED GAMING</h2>
<p id="description">Tap the target as many times as you can in 15 seconds!</p>
<button class="go" id="go">START GAME</button>
</div>
</div>
<script>
const area=document.getElementById("area");
const target=document.getElementById("target");
const msg=document.getElementById("msg");
const time=document.getElementById("time");
const score=document.getElementById("score");
const go=document.getElementById("go");
const description=document.getElementById("description");

let points=0;
let running=false;
let timer=null;
let endTime=0;

function moveTarget(){
const maxX=area.clientWidth-target.offsetWidth;
const maxY=area.clientHeight-target.offsetHeight;
target.style.left=Math.random()*Math.max(0,maxX)+"px";
target.style.top=Math.random()*Math.max(0,maxY)+"px";
}

function finish(){
running=false;
clearInterval(timer);
timer=null;
time.textContent="0";
target.style.display="none";
msg.style.display="flex";
msg.querySelector("h2").textContent="TIME'S UP!";
description.textContent="Your Score: "+points;
go.textContent="PLAY AGAIN";
try{
parent.postMessage({sg:"score",score:points,over:true},"*");
}catch(e){}
}

function startGame(){
clearInterval(timer);
points=0;
score.textContent="0";
time.textContent="15";
running=true;
msg.style.display="none";
target.style.display="block";
moveTarget();
endTime=Date.now()+15000;

timer=setInterval(()=>{
let remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
time.textContent=remaining;
if(remaining<=0)finish();
},100);
}

target.addEventListener("click",()=>{
if(!running)return;
points++;
score.textContent=points;
moveTarget();
});

go.addEventListener("click",startGame);
</script>
</body>
</html>

if(b){pl.veh=b;b.ai=0;b.ch=0;pl.h.g.visible=false;if(b.pol)crime(2)}}
function attack(){if(st!=='play'||pl.veh||pl.cd>0)return;ac();const w=pl.wpn;pl.yaw=cy;pl.cd=w?.28:.45;pl.atk=.25;const fx=Math.sin(cy),fz=Math.cos(cy),rg=w?45:2.3;noise(w?.14:.06,w?.35:.12,w?2600:500);
let bt=null,ba=rg;for(const p of PD){if(p.dead)continue;const dx=p.x-pl.x,dz=p.z-pl.z,al=dx*fx+dz*fz;if(al>0&&al<ba&&Math.abs(dx*fz-dz*fx)<1){ba=al;bt=p}}
if(w)for(const v of V){if(!v.pol||v.dead)continue;const dx=v.x-pl.x,dz=v.z-pl.z,al=dx*fx+dz*fz;if(al>0&&al<ba&&Math.abs(dx*fz-dz*fx)<2){ba=al;bt=v}}
if(!bt)return;if(bt.T){bt.hp-=12;crime(2);if(bt.hp<=0)boom(bt)}else{bt.hp-=w?2:1.1;if(bt.hp<=0)kill(bt)}}
// ---------- missions ----------
const MD=[{n:'First Wheels',r:500,s:[{k:'g',v:1,x:'Steal a car and drive to the marker'}]},{n:'Special Delivery',r:900,s:[{k:'g',x:'Pick up the package on foot'},{k:'g',v:1,x:'Deliver the package by car'}]},
{n:'Street Race',r:1500,s:[1,2,3,4,5].map(i=>({k:'g',v:1,t:30,x:'Race: checkpoint '+i+'/5'}))},{n:'Gang Fight',r:1200,s:[{k:'g',x:'Go to the gang hideout'},{k:'k',n:4,x:'Take out the gang'}]},
{n:'Bank Job',r:2500,s:[{k:'g',x:'Reach the bank'},{k:'w',x:'Escape the police! Lose your wanted level'}]},{n:'VIP Escort',r:1800,s:[{k:'g',x:'Meet the VIP'},{k:'g',v:1,t:70,x:'Drive the VIP to the airport'}]},{n:'Hidden Cache',r:800,s:[{k:'g',x:'Explore the city to find the hidden cache'}]}];
const MS={i:SV?SV.mi:0,s:0,t:0,k:0,pos:[0,0],wait:0,pause:2};
function ixNear(a,b){for(let n=0;n<50;n++){const x=(Math.random()*(N+1)|0)*PT,z=(Math.random()*(N+1)|0)*PT,d=Math.hypot(x-pl.px,z-pl.pz);if(d>a&&d<b)return[x,z]}return[PT*4,PT*4]}
function stepStart(){const s=MD[MS.i%MD.length].s[MS.s];MS.k=0;MS.t=s.t||0;
if(s.k==='w'){mkr.visible=false;wl=3;wS=0;MS.wait=4;nt('WANTED! Lose the cops')}else{if(s.k!=='k')MS.pos=ixNear(100,240);mkr.visible=true;mkr.position.set(MS.pos[0],25,MS.pos[1]);if(s.k==='k')for(let i=0;i<s.n;i++)spawnGang(MS.pos[0]+rnd(-6,6),MS.pos[1]+rnd(-6,6))}}
function mTick(dt){if(MS.pause>0){MS.pause-=dt;if(MS.pause<=0)stepStart();$('mt').textContent='Next mission loading…';return}
const d=MD[MS.i%MD.length],s=d.s[MS.s];let ok=0;
if(s.t){MS.t-=dt;if(MS.t<=0){nt('Mission failed: time is up');MS.s=0;stepStart();return}}
if(s.k==='g')ok=(!s.v||pl.veh)&&Math.hypot(pl.px-MS.pos[0],pl.pz-MS.pos[1])<8;else if(s.k==='k')ok=MS.k>=s.n;else{MS.wait-=dt;ok=wl===0&&MS.wait<0}
$('mt').textContent='#'+(MS.i+1)+' '+d.n+' — '+s.x+(s.k==='g'?' ('+Math.round(Math.hypot(pl.px-MS.pos[0],pl.pz-MS.pos[1]))+' m)':'')+(s.t?'  ⏱ '+Math.ceil(MS.t)+'s':'');
if(ok){MS.s++;if(MS.s>=d.s.length){const r=Math.round(d.r*(1+Math.floor(MS.i/MD.length)*.5));pl.money+=r;pl.ar=Math.min(100,pl.ar+25);nt('MISSION PASSED: '+d.n+'  +$'+r);MS.i++;MS.s=0;MS.pause=4;mkr.visible=false;save()}else{nt('Objective complete');stepStart()}}}
function save(){try{localStorage.setItem('cl_save',JSON.stringify({money:pl.money,mi:MS.i,wpn:pl.wpn,ar:pl.ar,col:pl.col}))}catch(e){}}
// ---------- simulation ----------
function stepV(v,dt){const me=v===pl.veh,T=v.T;
if(me){if(!v.dead){const[mx,my]=mvec();if(my>0)v.sp+=(v.sp<0?T.ac*2.5:T.ac)*my*dt;else if(my<0)v.sp-=(v.sp>0?T.ac*2.5:T.ac*.6)*-my*dt;else v.sp*=1-.25*dt;if(keys.space||keys.gj)v.sp*=1-3.5*dt;v.sp=cl(v.sp,-T.mx*.3,T.mx);v.yaw-=mx*cl(v.sp/6,-1,1)*(1.7-Math.abs(v.sp)/T.mx)*dt}else v.sp*=1-2*dt}
else if(v.dead)v.sp*=1-3*dt;
else if(v.pol&&wl>0&&(v.ch||Math.hypot(pl.px-v.x,pl.pz-v.z)<140)){v.ch=1;const dx=pl.px-v.x,dz=pl.pz-v.z,dist=Math.hypot(dx,dz);v.yaw+=ang(Math.atan2(dx,dz)-v.yaw)*Math.min(1,dt*2.5);const tg=dist<7?(pl.veh?pl.veh.sp:3):26+wl*3;v.sp+=(tg-v.sp)*Math.min(1,dt*1.5);if(wl>=2&&dist<30&&!pl.veh)hurt(wl*1.5*dt);else if(wl>=3&&dist<30)hurt(wl*dt)}
else if(v.ai){if(v.ch){v.ch=0;v.d=((1-Math.round(v.yaw/(PI/2)))%4+4)%4}
let d=v.d;const ev=d%2===0,A=ev?v.x:v.z,ca=Math.round(A/PT)*PT,idx=ca+(ev?'x':'z');
if(Math.abs(A-ca)<2.5&&v.li!==idx){v.li=idx;if(Math.random()<.4)v.d=d=(d+(Math.random()<.5?1:3))%4}
if(v.x<-5&&d===2||v.x>WS+5&&d===0||v.z<-5&&d===3||v.z>WS+5&&d===1)v.d=d=(d+2)%4;
const e2=d%2===0,Lc=e2?v.z:v.x,tl=Math.round(Lc/PT)*PT+LO[d],k=Math.min(1,dt*2.5);if(e2)v.z+=(tl-v.z)*k;else v.x+=(tl-v.x)*k;v.yaw+=ang(YW[d]-v.yaw)*Math.min(1,dt*5);
let tg=v.cr;const f=FW[d];for(const o of pl.veh?V:[...V,pl]){if(o===v)continue;const dx=o.x-v.x,dz=o.z-v.z,al=dx*f[0]+dz*f[1];if(al>0&&al<8+v.sp*.6&&Math.abs(dx*f[1]-dz*f[0])<2.4+(o.r||1)*.3)tg=al<5?0:Math.min(tg,v.cr*.3)}
v.sp+=(tg-v.sp)*Math.min(1,dt*(tg<v.sp?4:1.2))}
else v.sp*=1-2*dt;
v.x+=Math.sin(v.yaw)*v.sp*dt;v.z+=Math.cos(v.yaw)*v.sp*dt;
if(colB(v,v.r)){const s=Math.abs(v.sp);if(s>6){v.hp-=s*.6;if(me)hurt(s*.15)}v.sp*=-.3;if(v.hp<=0&&!v.dead)boom(v)}
for(const p of PD){if(p.dead||Math.abs(v.sp)<3)continue;if(Math.hypot(p.x-v.x,p.z-v.z)<v.r+.4){p.dead=1;p.t=0;p.h.g.rotation.x=-PI/2;p.h.g.position.y=.3;if(me&&!p.gang)crime(1);if(p.gang)MS.k++}}
if(!pl.veh&&Math.abs(v.sp)>4&&Math.hypot(pl.x-v.x,pl.z-v.z)<v.r+.5)hurt(Math.abs(v.sp)*2*dt*8);
if(v.hp<30&&!v.dead&&Math.random()<dt*.2)v.hp-=2;
v.g.position.set(v.x,0,v.z);v.g.rotation.y=v.yaw;if(v.pol&&(v.ch||me)){const f=Math.floor(t*6)%2;v.l1.visible=!!f;v.l2.visible=!f}}
function tick(dt){
tod=(tod+dt/240)%1;const day=-Math.cos(tod*2*PI),nf=cl(.35-day*1.1,0,1),a=(tod-.25)*2*PI;
sky.lerpColors(SKD,SKN,nf);if(wx)sky.lerp(GRY,.55*(1-nf*.85));if(flash>0){flash-=dt*3;hemi.intensity=1.8}else hemi.intensity=.22+.6*(1-nf)*(wx?.7:1);
scene.background=sky;scene.fog.color.copy(sky);scene.fog.near=FG[wx][0];scene.fog.far=FG[wx][1]*(1-nf*.3);sun.intensity=.15+.85*(1-nf)*(wx?.5:1);BM.forEach(m=>m.emissiveIntensity=nf*.9);
sun.position.set(pl.px+Math.cos(a)*90,Math.abs(Math.sin(a))*100+10,pl.pz+40);sun.target.position.set(pl.px,0,pl.pz);
if(wx===3&&Math.random()<dt*.15){flash=1;setTimeout(()=>noise(1.5,.5,300),400)}
if(RN.visible){for(let i=1;i<4500;i+=3){rp[i]-=40*dt;if(rp[i]<0)rp[i]+=40}RN.geometry.attributes.position.needsUpdate=true;RN.position.set(pl.px,0,pl.pz)}
// player
const v=pl.veh;pl.cd-=dt;pl.atk-=dt;
if(!v){const[mx,my]=mvec(),f=[Math.sin(cy),Math.cos(cy)],r=[-Math.cos(cy),Math.sin(cy)];let dx=f[0]*my+r[0]*mx,dz=f[1]*my+r[1]*mx;const l=Math.hypot(dx,dz);pl.crouch=keys.c?1:0;
if(l>.1){const sp=(keys.sh?8:4.5)*(pl.crouch?.5:1)*Math.min(1,l);dx/=l;dz/=l;pl.x+=dx*sp*dt;pl.z+=dz*sp*dt;pl.yaw+=ang(Math.atan2(dx,dz)-pl.yaw)*Math.min(1,dt*12);pl.ws=sp}else pl.ws=0;
if(pl.atk>0)pl.yaw=cy;if((keys.space||keys.gj)&&pl.y<=.01){pl.vy=7.5;keys.gj=0}pl.vy-=20*dt;pl.y=Math.max(0,pl.y+pl.vy*dt);if(pl.y===0)pl.vy=0;colB(pl,.6);
const h=pl.h,sw=Math.sin(t*pl.ws*2.2)*Math.min(.9,pl.ws*.2);h.L.rotation.x=sw;h.R.rotation.x=-sw;h.A.rotation.x=pl.atk>0?-1.5:-sw;h.B.rotation.x=pl.atk>0&&pl.wpn?-1.5:sw;
h.g.position.set(pl.x,pl.y,pl.z);h.g.rotation.y=pl.yaw;h.g.scale.y=pl.crouch?.75:1;pl.px=pl.x;pl.pz=pl.z}
else{pl.px=v.x;pl.pz=v.z;pl.x=v.x;pl.z=v.z;if(Math.abs(v.sp)>1)cy+=ang(v.yaw-cy)*Math.min(1,dt*2.2)*(v.sp>0?1:0)}
// world
let pc=0;for(const q of V){stepV(q,dt);if(q.ch)pc++}
for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++){const a=V[i],b=V[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=a.r+b.r;if(d<m&&d>.01){const p=(m-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*p;a.z-=nz*p;b.x+=nx*p;b.z+=nz*p;const rel=Math.abs(a.sp-b.sp);if(rel>8){a.hp-=rel*.5;b.hp-=rel*.5;if(a===pl.veh||b===pl.veh){hurt(rel*.2);if((a.pol||b.pol))crime(2)}if(a.hp<=0&&!a.dead)boom(a);if(b.hp<=0&&!b.dead)boom(b)}a.sp*=.7;b.sp*=.7}}
for(const p of PD){if(p.dead){p.t+=dt;if(p.t>6){if(p.gang){PD.splice(PD.indexOf(p),1);scene.remove(p.h.g)}else placePed(p)}continue}
const h=p.h;if(p.gang){const dx=pl.px-p.x,dz=pl.pz-p.z,d=Math.hypot(dx,dz);h.g.rotation.y=Math.atan2(dx,dz);if(d>9){p.x+=dx/d*3.2*dt;p.z+=dz/d*3.2*dt;colB(p,.5)}if(d<22)hurt(4*dt)}
else{if(p.ax)p.z+=p.dir*1.5*dt;else p.x+=p.dir*1.5*dt;if(p.x<-10||p.x>WS+10||p.z<-10||p.z>WS+10)p.dir*=-1;h.g.rotation.y=p.ax?(p.dir>0?0:PI):(p.dir>0?PI/2:-PI/2)}
const sw=Math.sin(t*6+p.x)*.7;h.L.rotation.x=sw;h.R.rotation.x=-sw;h.A.rotation.x=-sw;h.B.rotation.x=sw;h.g.position.set(p.x,0,p.z)}
// wanted
let ns=0;for(const q of V)if(q.pol&&Math.hypot(q.x-pl.px,q.z-pl.pz)<75)ns=1;
if(wl>0){wS=ns?0:wS+dt;if(wS>10){wl=0;nt('Wanted level lost')}if(wl>0)wS=ns?0:wS;
if(pc<Math.min(wl*2,8)&&Math.random()<dt*1.5){const p=V.find(q=>q.pol&&!q.ch&&Math.hypot(q.x-pl.px,q.z-pl.pz)>110);if(p){const ev=Math.random()<.5,A=cl((ev?pl.px:pl.pz)+rnd(-100,100),0,WS),L=Math.round(((ev?pl.pz:pl.px)+rnd(-100,100))/PT)*PT;p.x=ev?A:L;p.z=ev?L:A;p.sp=15;p.yaw=ev?PI/2:0;p.ch=1;p.dead=0}}}
else V.forEach(q=>{if(q.pol)q.ch=0});
mTick(dt);
// camera
const D=v?10+v.T.l*.3:6,ty=(v?1.8:1.6+pl.y)-(pl.crouch?.4:0),tx=pl.px,tz=pl.pz,cpp=v?.25:cp;
cam.position.set(tx-Math.sin(cy)*D*Math.cos(cpp),ty+Math.sin(cpp)*D+.5,tz-Math.cos(cy)*D*Math.cos(cpp));cam.lookAt(tx,ty,tz);
// audio
if(AC){engG.gain.value=mute||!v?0:.035;if(v)eng.frequency.value=40+Math.abs(v.sp)*3.5;let sd=999;for(const q of V)if(q.ch)sd=Math.min(sd,Math.hypot(q.x-pl.px,q.z-pl.pz));sirG.gain.value=mute||sd>100?0:.02*(1-sd/100);sir.frequency.value=800+Math.sin(t*7)*200}
if(pl.hp<=0)die();
hud()}
function die(){st='dead';$('dead').classList.remove('hide');setTimeout(()=>{pl.hp=100;pl.ar=0;if(pl.veh){pl.veh.ai=0;pl.veh=null;pl.h.g.visible=true}pl.x=PT+9;pl.z=PT+4;pl.money-=Math.min(pl.money,300);wl=0;MS.s=0;MS.pause=3;mkr.visible=false;V.forEach(q=>q.ch=0);$('dead').classList.add('hide');st='play'},2500)}
// ---------- HUD ----------
const mm=$('mm'),mx_=mm.getContext('2d');let fr=0;
function hud(){const v=pl.veh;$('hb').style.width=Math.max(0,pl.hp)+'%';$('ab').style.width=pl.ar+'%';$('mo').textContent='$'+Math.floor(pl.money);
$('st').textContent=wl?('★'.repeat(wl)+'☆'.repeat(5-wl)):'';const h=tod*24|0;$('ck').textContent=(h<10?'0':'')+h+':'+(((tod*24)%1)*60|0).toString().padStart(2,'0')+' · '+WN[wx]+' · '+(pl.wpn?'Pistol':'Fists');
$('sp').textContent=v?Math.round(Math.abs(v.sp)*3.6)+' km/h · '+Math.max(0,Math.round(v.hp))+'% HP':'';
let p='';if(v){if(near(v,SH[3],7))p='E: '+SH[3].n+' — '+SH[3].t}else{for(const s of SH)if(near(pl,s,7)&&s.n!=='Garage')p='E: '+s.n+' — '+s.t;if(!p)for(const q of V)if(!q.dead&&Math.hypot(q.x-pl.x,q.z-pl.z)<5){p='E: enter vehicle';break}}$('pr').textContent=p;
if(++fr%2)return;const c=mx_,s=.5,cs=Math.cos(cy),sn=Math.sin(cy),M=(x,z)=>{const dx=x-pl.px,dz=z-pl.pz;return[(-dx*cs+dz*sn)*s,-(dx*sn+dz*cs)*s]};
c.clearRect(0,0,150,150);c.save();c.translate(75,75);c.strokeStyle='#555a63';c.lineWidth=RW*s;for(let i=0;i<=N;i++){let a=M(i*PT,-20),b=M(i*PT,WS+20);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();a=M(-20,i*PT);b=M(WS+20,i*PT);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}
const dot=(x,z,col,r)=>{const m=M(x,z);c.fillStyle=col;c.fillRect(m[0]-r,m[1]-r,r*2,r*2)};SH.forEach(q=>dot(q.x,q.z,'#'+q.c.toString(16).padStart(6,'0'),4));
for(const q of V)if(q.ch)dot(q.x,q.z,Math.floor(t*4)%2?'#f33':'#36f',3);if(mkr.visible)dot(MS.pos[0],MS.pos[1],'#ffee00',5);
c.fillStyle='#fff';c.beginPath();c.moveTo(0,-8);c.lineTo(-5,5);c.lineTo(5,5);c.fill();c.restore()}
// ---------- flow ----------
function begin(){ac();$('menu').classList.add('hide');$('hud').classList.remove('hide');if(touch)$('tc').classList.remove('hide');st='play';if(!touch&&$('c').requestPointerLock)$('c').requestPointerLock()}
function pause(){if(st==='play'){st='pause';$('pause').classList.remove('hide');if(document.exitPointerLock)document.exitPointerLock()}else if(st==='pause'){st='play';$('pause').classList.add('hide');if(!touch&&$('c').requestPointerLock)$('c').requestPointerLock()}}
$('new').onclick=()=>{try{localStorage.removeItem('cl_save')}catch(e){}pl.money=1000;pl.ar=0;pl.wpn=1;MS.i=0;begin()};$('cont').onclick=begin;$('cont').style.display=SV?'':'none';
$('res').onclick=pause;$('sv').onclick=()=>{save();nt('Game saved')};$('qa').onclick=e=>{sun.castShadow=!sun.castShadow;e.target.textContent='Shadows: '+(sun.castShadow?'on':'off')};
$('sn').onclick=e=>{mute=!mute;e.target.textContent='Sound: '+(mute?'off':'on')};$('wx').onclick=()=>setW(wx+1);setInterval(()=>{if(st==='play')save()},10000);
setInterval(()=>{if(st==='play'&&Math.random()<.2)setW(Math.random()<.5?0:1+(Math.random()*3|0))},45000);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(touch){mm.style.width=mm.style.height='110px'}}addEventListener('resize',rs);rs();
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;t+=dt;
if(st==='play')tick(dt);else if(st==='menu'){cy+=dt*.15;scene.background=SKD;cam.position.set(pl.x-Math.sin(cy)*18,9,pl.z-Math.cos(cy)*18);cam.lookAt(pl.x,3,pl.z);pl.px=pl.x;pl.pz=pl.z;sun.position.set(pl.x+50,90,pl.z+40);sun.target.position.set(pl.x,0,pl.z);V.forEach(q=>stepV(q,dt))}
R.render(scene,cam)}
setW(0);requestAnimationFrame(loop);
